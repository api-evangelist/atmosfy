aid: atmosfy
name: Atmosfy
description: >-
  Atmosfy is a live-video mapping platform that bills itself as the world's largest
  live video map, aggregating 500M+ geo-tagged short-form videos across 100M+ places
  in 20,000+ cities and 150+ countries. The consumer app lets people see what
  restaurants, bars, hotels, and events actually look like in real time, while its
  business side offers brand targeting, embedded local-video integrations for other
  platforms, and video corpora for AI training. Surfaced as a portfolio company of
  Redpoint Ventures and added to the API Evangelist network; as of this enrichment
  pass Atmosfy publishes no public developer API, SDK, or developer portal, so this
  profile captures company identity, legal/link surface, and domain-security posture.
